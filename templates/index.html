<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3 Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #667eea;
        }

        input[type="text"]::placeholder {
            color: #aaa;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            display: block;
        }

        .download-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            margin-top: 15px;
        }

        .download-btn:hover {
            box-shadow: 0 10px 20px rgba(17, 153, 142, 0.4);
        }

        .quality-badge {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-top: 10px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🎵</div>
        <h1>YouTube to MP3</h1>
        <p class="subtitle">Converti video YouTube in file MP3 di alta qualità</p>
        <div class="quality-badge">Qualità: 320 kbps</div>

        <div class="input-group" style="margin-top: 30px;">
            <input 
                type="text" 
                id="youtubeUrl" 
                placeholder="Incolla qui il link YouTube..."
            >
        </div>

        <button id="convertBtn" onclick="convertVideo()">
            Converti e Scarica
        </button>

        <div id="status" class="status"></div>
    </div>

    <script>
        async function convertVideo() {
            const urlInput = document.getElementById('youtubeUrl');
            const convertBtn = document.getElementById('convertBtn');
            const statusDiv = document.getElementById('status');
            const url = urlInput.value.trim();

            if (!url) {
                showStatus('Per favore, inserisci un URL YouTube valido', 'error');
                return;
            }

            // Disabilita il bottone e mostra loading
            convertBtn.disabled = true;
            convertBtn.innerHTML = '<div class="spinner"></div> Elaborazione...';
            showStatus('Download e conversione in corso...', 'loading');

            try {
                // Step 1: Converti il video
                const response = await fetch('/convert', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showStatus(
                        `✅ Conversione completata!<br><strong>${escapeHtml(data.title)}</strong>`,
                        'success'
                    );
                    
                    // Aggiungi bottone di download
                    const downloadBtn = document.createElement('button');
                    downloadBtn.className = 'download-btn';
                    downloadBtn.innerHTML = '📥 Scarica MP3';
                    downloadBtn.onclick = () => window.location.href = `/download/${data.filename}`;
                    
                    // Rimuovi eventuali bottoni precedenti
                    const existingBtn = statusDiv.querySelector('.download-btn');
                    if (existingBtn) existingBtn.remove();
                    
                    statusDiv.appendChild(downloadBtn);
                    
                    // Riabilita il bottone principale
                    convertBtn.disabled = false;
                    convertBtn.innerHTML = 'Converti e Scarica';
                } else {
                    throw new Error(data.error || 'Errore durante la conversione');
                }

            } catch (error) {
                showStatus(`❌ Errore: ${error.message}`, 'error');
                convertBtn.disabled = false;
                convertBtn.innerHTML = 'Converti e Scarica';
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Permetti di premere Invio per convertire
        document.getElementById('youtubeUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                convertVideo();
            }
        });
    </script>
</body>
</html>
